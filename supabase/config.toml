# ============================================================================
# Supabase local config — Clínica Almudena Marchesi Fernández
# Documentación: https://supabase.com/docs/reference/cli/config
# ============================================================================

# Identificador del proyecto (debe coincidir con el slug en Supabase Cloud
# cuando se ejecute `supabase link --project-ref <ref>`).
project_id = "clinica-almudena"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
# Alineado con el proyecto enlazado (Postgres 17 en Supabase Cloud).
major_version = 17

[db.pooler]
enabled = true
port = 54329
pool_mode = "transaction"
default_pool_size = 20
max_client_conn = 100

[studio]
enabled = true
port = 54323
api_url = "http://127.0.0.1"

[inbucket]
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = "50MiB"

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = [
  "http://localhost:3000/auth/callback",
  "https://clinica-almudena.vercel.app/auth/callback",
  "https://ampsicologia.es/auth/callback",
  "https://www.ampsicologia.es/auth/callback",
  "https://amclinicapsicologia.es/auth/callback",
  "https://www.amclinicapsicologia.es/auth/callback"
]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
# Auto-registro controlado: habilitado, pero con enable_confirmations=true
# (el usuario NO puede entrar al portal hasta verificar email).
enable_signup = true

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = true
secure_password_change = true
max_frequency = "1m"

# Plantilla HTML (Go template) para verificación post-signup. En producción,
# copiar el HTML al panel Auth de Supabase o mantener este path si despliegas Auth self-hosted.
[auth.email.template.confirmation]
subject = "Confirma tu correo · Clínica Almudena Marchesi Fernández"
# Ruta relativa al cwd del CLI (raíz del repo), no solo a la carpeta supabase/.
content_path = "./supabase/templates/confirmation.html"

[auth.mfa]
max_enrolled_factors = 10

[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true

[auth.sms]
enable_signup = false
enable_confirmations = false

[auth.rate_limit]
email_sent = 5 # por hora
sms_sent = 30
sign_in_sign_ups = 30
token_refresh = 150
token_verifications = 30

[edge_runtime]
enabled = true
inspector_port = 8083

# ----------------------------------------------------------------------------
# Edge Functions — declaración explícita
# ----------------------------------------------------------------------------
# send-email: invocada desde el frontend (JWT anon del usuario) y desde
# triggers server-side (service_role). Requiere JWT.
[functions.send-email]
verify_jwt = true

# cron-recordatorios-24h: invocada únicamente por pg_cron con CRON_SECRET
# custom en el header Authorization. No usamos el JWT estándar de Supabase,
# así que lo desactivamos y validamos el secret dentro de la función.
[functions.cron-recordatorios-24h]
verify_jwt = false

# stripe-checkout: invocada por el paciente autenticado para crear una Checkout
# session. Requiere JWT (validamos user con getUser antes de llamar a Stripe).
# JWT de sesión (ES256 en proyectos nuevos): el gateway con verify_jwt=true
# devuelve 401 UNAUTHORIZED_UNSUPPORTED_TOKEN_ALGORITHM. La función ya
# valida el usuario con supabase.auth.getUser() en Deno.
[functions.stripe-checkout]
verify_jwt = false

# stripe-payment-intent: invocada por el paciente autenticado para crear un
# PaymentIntent embebido (Payment Element en drawer). Requiere JWT — validamos
# user con getUser antes de reservar contexto RPC y llamar a Stripe. Sin esta
# declaración explícita, el gateway de Supabase Cloud rechaza con 401 antes
# incluso de ejecutar la función (causa raíz del http_401 reportado).
[functions.stripe-payment-intent]
verify_jwt = false

# stripe-webhook: invocado por los servidores de Stripe, que NO envían JWT de
# Supabase. La autenticación es vía firma HMAC-SHA256 (STRIPE_WEBHOOK_SECRET)
# verificada dentro de la función sobre el cuerpo raw.
[functions.stripe-webhook]
verify_jwt = false

# cancel-cita: invocada por paciente o admin autenticado para cancelar una
# cita. La RPC cancelar_cita usa auth.uid() para aplicar permisos granulares.
[functions.cancel-cita]
verify_jwt = false

# assign-recurso: invocada exclusivamente por admin para asignar un recurso
# a un paciente y disparar el email nueva_asignacion.
[functions.assign-recurso]
verify_jwt = false

# invoice-pdf: JWT de paciente; misma limitación ES256 en el gateway.
[functions.invoice-pdf]
verify_jwt = false

# resend-webhook: invocado por Resend con firma Svix (svix-id, svix-timestamp,
# svix-signature). No usa JWT de Supabase — validamos la firma HMAC-SHA256
# con RESEND_WEBHOOK_SECRET dentro de la función.
[functions.resend-webhook]
verify_jwt = false

# health: endpoint público para monitor externo (UptimeRobot, healthchecks.io).
# Devuelve metadata mínima (ok, status, latencias) sin PII ni ciphertext.
# No requiere JWT — usa SERVICE_ROLE_KEY server-side para chequear
# `app_encryption_ready()` + una query DB trivial.
[functions.health]
verify_jwt = false
